name: Release Obsidian plugin
on:
  push:
    tags:
      - "*"
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - name: Build plugin
        run: |
          npm install --legacy-peer-deps
          npm run build
      - name: Collect release assets
        id: assets
        run: |
          assets=(main.js manifest.json)
          # Include mermaid bundle only when the flow panel feature flag is enabled.
          if grep -q 'FLOW_PANEL: true' src/featureFlags.ts; then
            assets+=(mermaid.bundle.js)
          fi
          if [ -f styles.css ]; then
            assets+=(styles.css)
          fi
          # Export as newline-delimited list for the attestation step.
          printf '%s\n' "${assets[@]}" > /tmp/asset-list.txt
          echo "paths=$(IFS=,; echo "${assets[*]}")" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.assets.outputs.paths }}
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          mapfile -t assets < /tmp/asset-list.txt
          gh release create "$tag" \
            --title="$tag" \
            --generate-notes \
            --draft \
            "${assets[@]}"
